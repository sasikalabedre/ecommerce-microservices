name: Ecommerce Microservices CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker images
        run: |
          docker build -t auth-service:latest ./auth-service
          docker build -t product-service:latest ./product-service
          docker build -t order-service:latest ./order-service

      - name: Tag Docker images
        run: |
          docker tag auth-service:latest 939169264693.dkr.ecr.ap-southeast-2.amazonaws.com/ecommerce/auth-service:latest
          docker tag product-service:latest 939169264693.dkr.ecr.ap-southeast-2.amazonaws.com/ecommerce/product-service:latest
          docker tag order-service:latest 939169264693.dkr.ecr.ap-southeast-2.amazonaws.com/order-service:latest

      - name: Push Docker images to ECR
        run: |
          docker push 939169264693.dkr.ecr.ap-southeast-2.amazonaws.com/ecommerce/auth-service:latest
          docker push 939169264693.dkr.ecr.ap-southeast-2.amazonaws.com/ecommerce/product-service:latest
          docker push 939169264693.dkr.ecr.ap-southeast-2.amazonaws.com/order-service:latest
